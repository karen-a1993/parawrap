[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parawrap"
version = "0.1.0"
description = "Reflow plain text to a fixed line width from the command line"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "karen-a1993"}]

[project.scripts]
parawrap = "parawrap.cli:main"

[tool.setuptools.packages.find]
include = ["parawrap*"]
